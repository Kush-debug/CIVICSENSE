<script src="auth.js"></script>
<script>
    let currentPortal = "CITIZEN";

    const tabCitizen = document.getElementById("tabCitizen");
    const tabEmployee = document.getElementById("tabEmployee");
    const loginForm = document.getElementById("loginForm");
    const loginAlert = document.getElementById("loginAlert");
    const loginBtn = document.getElementById("loginBtn");
    const demoEmail = document.getElementById("demoEmail");
    const demoPass = document.getElementById("demoPass");
    const fillDemoBtn = document.getElementById("fillDemoBtn");
    const togglePass = document.getElementById("togglePass");
    const passwordInput = document.getElementById("password");
    const emailInput = document.getElementById("email");
    const captchaCode = document.getElementById("captchaCode");
    const captchaInput = document.getElementById("captchaInput");
    const reloadCaptcha = document.getElementById("reloadCaptcha");

    // Citizen Modal Elements
    const registerModal = document.getElementById("registerModal");
    const openRegisterModal = document.getElementById("openRegisterModal");
    const closeRegisterModal = document.getElementById("closeRegisterModal");
    const registerForm = document.getElementById("registerForm");
    const citizenRegisterPrompt = document.getElementById("citizenRegisterPrompt");

    // Officer Modal Elements
    const officerRegisterModal = document.getElementById("officerRegisterModal");
    const openOfficerRegisterModal = document.getElementById("openOfficerRegisterModal");
    const closeOfficerRegisterModal = document.getElementById("closeOfficerRegisterModal");
    const officerRegisterForm = document.getElementById("officerRegisterForm");
    const officerRegisterPrompt = document.getElementById("officerRegisterPrompt");
    const officerRegAlert = document.getElementById("officerRegAlert");

    // ✅ Redirect if already authenticated — ABSOLUTE paths now
    const activeSession = getSession();
    if (activeSession) {
        window.location.href = activeSession.role === "CITIZEN"
            ? "/user_portal/index.html"
            : "/employee_portal/index.html";
    }

    // Generate Random Captcha
    function generateCaptcha() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let code = "";
        for (let i = 0; i < 5; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        captchaCode.textContent = code;
        captchaInput.value = "";
    }
    generateCaptcha();
    reloadCaptcha.addEventListener("click", generateCaptcha);

    // Switch Portals
    function setPortal(portal) {
        currentPortal = portal;
        const isCitizen = portal === "CITIZEN";

        tabCitizen.classList.toggle("active", isCitizen);
        tabEmployee.classList.toggle("active", !isCitizen);
        tabEmployee.classList.toggle("officer-tab", !isCitizen);

        loginBtn.classList.toggle("officer-btn", !isCitizen);
        loginBtn.innerHTML = isCitizen
            ? '<span>Sign In to Citizen Portal</span> ➔'
            : '<span>Sign In to Officer Portal</span> ➔';

        document.getElementById("labelEmail").textContent = isCitizen
            ? "Citizen Email / Registered Mobile"
            : "Official Gov Officer Email";

        if (citizenRegisterPrompt) citizenRegisterPrompt.style.display = isCitizen ? "block" : "none";
        if (officerRegisterPrompt) officerRegisterPrompt.style.display = isCitizen ? "none" : "block";

        const userKey = isCitizen ? "citizen" : "employee";
        demoEmail.textContent = DEMO_USERS[userKey].email;
        demoPass.textContent = DEMO_USERS[userKey].password;

        loginAlert.style.display = "none";
    }

    tabCitizen.addEventListener("click", () => setPortal("CITIZEN"));
    tabEmployee.addEventListener("click", () => setPortal("EMPLOYEE"));

    // Fill Demo Credentials
    fillDemoBtn.addEventListener("click", () => {
        const userKey = currentPortal === "CITIZEN" ? "citizen" : "employee";
        emailInput.value = DEMO_USERS[userKey].email;
        passwordInput.value = DEMO_USERS[userKey].password;
        captchaInput.value = captchaCode.textContent;
    });

    // Toggle Password Visibility
    togglePass.addEventListener("click", () => {
        const isPass = passwordInput.type === "password";
        passwordInput.type = isPass ? "text" : "password";
        togglePass.textContent = isPass ? "🙈" : "👁️";
    });

    // Handle Login Submission
    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginAlert.style.display = "none";

        // Validate Captcha
        if (captchaInput.value.trim().toUpperCase() !== captchaCode.textContent.trim().toUpperCase()) {
            loginAlert.textContent = "Security Captcha does not match. Please try again.";
            loginAlert.style.display = "flex";
            generateCaptcha();
            return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = "<span>Authenticating with Gov Portal...</span>";

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        const res = await apiLogin(email, password, currentPortal);

        if (!res.success) {
            loginAlert.textContent = res.message || "Invalid credentials.";
            loginAlert.style.display = "flex";
            loginBtn.disabled = false;
            loginBtn.innerHTML = currentPortal === "CITIZEN"
                ? '<span>Sign In to Citizen Portal</span> ➔'
                : '<span>Sign In to Officer Portal</span> ➔';
            generateCaptcha();
            return;
        }

        showToast("Official Login Verified!", "success");

        // ✅ ABSOLUTE path
        setTimeout(() => {
            window.location.href = currentPortal === "CITIZEN"
                ? "/user_portal/index.html"
                : "/employee_portal/index.html";
        }, 500);
    });

    // Citizen Modal Controls
    openRegisterModal.addEventListener("click", () => registerModal.style.display = "flex");
    closeRegisterModal.addEventListener("click", () => registerModal.style.display = "none");

    // Officer Modal Controls
    openOfficerRegisterModal.addEventListener("click", () => {
        officerRegAlert.style.display = "none";
        officerRegisterModal.style.display = "flex";
    });
    closeOfficerRegisterModal.addEventListener("click", () => officerRegisterModal.style.display = "none");

    window.addEventListener("click", (e) => {
        if (e.target === registerModal) registerModal.style.display = "none";
        if (e.target === officerRegisterModal) officerRegisterModal.style.display = "none";
    });

    // Citizen Register Submission
    registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById("submitRegisterBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "Registering...";

        const payload = {
            name: document.getElementById("regName").value,
            email: document.getElementById("regEmail").value,
            phone: document.getElementById("regPhone").value,
            ward_no: document.getElementById("regWard").value,
            aadhaar_last4: document.getElementById("regAadhaar").value,
            password: document.getElementById("regPassword").value
        };

        const res = await apiRegister(payload);
        if (!res.success) {
            showToast(res.message || "Registration failed.", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Complete Citizen Registration ➔";
            return;
        }

        showToast("Registration successful! Redirecting to Citizen Portal...", "success");
        // ✅ ABSOLUTE path
        setTimeout(() => {
            window.location.href = "/user_portal/index.html";
        }, 600);
    });

    // Municipal Officer Register Submission
    officerRegisterForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        officerRegAlert.style.display = "none";

        const pass = document.getElementById("offRegPassword").value;
        const confirmPass = document.getElementById("offRegConfirmPassword").value;

        if (pass !== confirmPass) {
            officerRegAlert.textContent = "Passwords do not match. Please re-enter.";
            officerRegAlert.style.display = "flex";
            return;
        }

        if (pass.length < 6) {
            officerRegAlert.textContent = "Password must be at least 6 characters.";
            officerRegAlert.style.display = "flex";
            return;
        }

        const submitBtn = document.getElementById("submitOfficerRegisterBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "Registering Municipal Officer...";

        const payload = {
            name: document.getElementById("offRegName").value.trim(),
            email: document.getElementById("offRegEmail").value.trim(),
            phone: document.getElementById("offRegPhone").value.trim(),
            department: document.getElementById("offRegDept").value,
            designation: document.getElementById("offRegDesignation").value,
            ward_no: document.getElementById("offRegWard").value,
            employee_code: document.getElementById("offRegEmpCode").value.trim() || null,
            password: pass
        };

        const res = await apiRegisterOfficer(payload);

        if (!res.success) {
            officerRegAlert.textContent = res.message || "Officer registration failed.";
            officerRegAlert.style.display = "flex";
            submitBtn.disabled = false;
            submitBtn.textContent = "Complete Officer Registration & Access Control Room ➔";
            return;
        }

        showToast("Municipal Officer Registered! Welcome to Control Room.", "success");
        // ✅ ABSOLUTE path
        setTimeout(() => {
            window.location.href = "/employee_portal/index.html";
        }, 600);
    });
</script>
